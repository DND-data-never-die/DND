# AGP 8.x refuses AndroidX dependencies unless this is set (AGP 9 makes it the default).
android.useAndroidX=true
# Gradle's default daemon heap (512 MB) is tight for Compose + D8. The Kotlin daemon inherits
# this heap and the Robolectric test JVM takes 2 GB, so 2 GB keeps the total inside the
# 8 GB private-repo runner.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.code.style=official
